name: CI

on:
  push:
    branches: [ master ]
  workflow_dispatch:
    inputs:
      runner:
        description: 'Образ macOS-раннера. Нужен с Xcode, близким к versions.json'
        required: false
        default: 'macos-15'
        type: string
      xcode_version:
        description: 'Версия Xcode. Пусто = newest доступный на раннере'
        required: false
        default: ''
        type: string
      continue_on_error:
        description: 'Показать ВСЕ ошибки компиляции за один прогон (bazel --keep_going)'
        required: false
        default: 'true'
        type: boolean

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # macos-13 снят GitHub. macos-26 нужен под Xcode 26.x из versions.json;
    # на macos-15 стоит Xcode 16.x, и сборка может не пройти — тогда ставь
    # runner: macos-26 вручную при запуске.
    runs-on: ${{ github.event.inputs.runner || 'macos-15' }}
    timeout-minutes: 350

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: 'recursive'
          # Полная история не нужна: build number берём из номера прогона,
          # а fetch-depth: 0 на репо с 268 сабмодулями стоит минут двадцати.
          fetch-depth: 1

      - name: Select Xcode
        id: xcode
        run: |
          set -euo pipefail
          WANTED="${{ github.event.inputs.xcode_version }}"
          if [ -z "$WANTED" ]; then
            WANTED="$(python3 -c 'import json;print(json.load(open("versions.json"))["xcode"])')'
          fi

          APP=""
          if [ -d "/Applications/Xcode_${WANTED}.app" ]; then
            APP="/Applications/Xcode_${WANTED}.app"
          fi

          if [ -z "$APP" ]; then
            # Последний по номеру версии. /Applications/Xcode.app без суффикса
            # тоже попадает в список, но sort -V считает его пустым — поэтому
            # не по имени, а перебором с проверкой, что Xcode живой.
            APP="$(for a in /Applications/Xcode*.app; do
                     [ -d "$a" ] || continue
                     if DEVELOPER_DIR="$a/Contents/Developer" xcodebuild -version >/dev/null 2>&1; then
                       echo "$a"
                     fi
                   done | sort -V | tail -1)"
          fi

          if [ -z "$APP" ]; then
            echo "::error::На раннере нет ни одного рабочего Xcode"
            exit 1
          fi

          if [ "$(basename "$APP")" != "Xcode_${WANTED}.app" ]; then
            echo "::warning::Xcode ${WANTED} отсутствует, берём $(basename "$APP"). Если сборка упадёт на версии Xcode — прогони с runner=macos-26."
          fi

          # Именно .app, а не производные от DEVELOPER_DIR: basename дважды
          # dirname'нутого пути даёт "Contents", и чистка диска снесла бы все
          # Xcode вместе с выбранным.
          echo "XCODE_APP=$APP" >> "$GITHUB_ENV"
          echo "DEVELOPER_DIR=$APP/Contents/Developer" >> "$GITHUB_ENV"
          echo "selected=$(basename "$APP")" >> "$GITHUB_OUTPUT"
          "$APP/Contents/Developer/usr/bin/xcodebuild" -version || true

      # Место — главная причина падений: сборочному дереву нужно 30+ ГБ,
      # а на бесплатных macOS-раннерах его ~14. Выкидываем всё, что не нужно,
      # ДО сборки. Выбранный Xcode не трогаем.
      - name: Free disk space
        run: |
          set -euo pipefail
          KEEP="$(basename "$XCODE_APP")"
          df -h /

          for app in /Applications/Xcode*.app; do
            [ -e "$app" ] || continue
            [ "$(basename "$app")" = "$KEEP" ] && continue
            sudo rm -rf "$app"
          done

          sudo rm -rf /Library/Developer/CoreSimulator/Profiles/Runtimes
          sudo rm -rf /Library/Developer/CoreSimulator/Profiles/Devices
          sudo rm -rf /usr/local/share/chocolatey
          sudo rm -rf /Library/Developer/CoreSimulator/Caches
          rm -rf ~/Library/Caches/*
          rm -rf ~/Library/Developer/Xcode/DerivedData
          rm -rf /Users/runner/Library/Developer/CoreSimulator

          df -h /

      - name: Verify Xcode survived cleanup
        run: |
          set -euo pipefail
          if [ ! -d "$XCODE_APP" ]; then
            echo "::error::Выбранный Xcode $XCODE_APP удалён чисткой диска"
            exit 1
          fi
          xcode-select -p
          xcodebuild -version

      - name: Report disk headroom
        run: |
          set -euo pipefail
          # -P даёт POSIX-формат (одна строка заголовка), -K — килобайты.
          # Блок . в df -g на macOS ломает awk по NR==2, поэтому так.
          FREE_KB="$(df -Pk / | awk '$6 == "/" {print $4}')"
          if [ -z "$FREE_KB" ]; then
            echo "::warning::Не удалось определить свободное место"
            exit 0
          fi
          FREE_GB=$((FREE_KB / 1024 / 1024))
          echo "Свободно: ${FREE_GB} ГБ"
          if [ "$FREE_GB" -lt 35 ]; then
            echo "::warning::Свободно ${FREE_GB} ГБ, сборке нужно ~35. Скорее всего упадёт с 'No space left on device'. Нужен macOS large runner."
          fi

      # Раньше воркспейс переносился в /Users/Shared/telegram-ios, но это ломало
      # все node-шаги (actions/* запускаются из GITHUB_WORKSPACE и падают с
      # "No such file or directory"), а ещё съедало место на копирование.
      # Путь /Users/runner/work/<repo>/<repo> и так стабилен между прогонами.
      - name: Record source directory
        run: |
          set -euo pipefail
          echo "SOURCE_DIR=$GITHUB_WORKSPACE" >> "$GITHUB_ENV"

      - name: Import fake codesigning
        run: python3 build-system/Make/ImportCertificates.py --path build-system/fake-codesigning/certs

      - name: Build
        env:
          BAZEL_USER_ROOT: /private/var/tmp/_bazel_containerhost
        run: |
          set -euo pipefail

          BUILD_NUMBER="$((${{ github.run_number }} + $(cat build_number_offset)))"
          export APP_VERSION="$(python3 -c 'import json;print(json.load(open("versions.json"))["app"])')"
          echo "BUILD_NUMBER=$BUILD_NUMBER" >> "$GITHUB_ENV"
          echo "APP_VERSION=$APP_VERSION" >> "$GITHUB_ENV"

          CONTINUE=''
          if [ '${{ github.event.inputs.continue_on_error }}' != 'false' ]; then
            CONTINUE='--continueOnError'
          fi

          # pipefail обязателен: иначе tee съест код возврата и упавший Bazel
          # нарисуется зелёным.
          set -o pipefail
          python3 -u build-system/Make/Make.py \
            --bazelUserRoot="$BAZEL_USER_ROOT" \
            --overrideXcodeVersion \
            build \
            --configurationPath="build-system/appstore-configuration.json" \
            --codesigningInformationPath=build-system/fake-codesigning \
            --configuration=release_arm64 \
            --buildNumber="$BUILD_NUMBER" \
            $CONTINUE 2>&1 | tee build.log

      # Лог нужен всегда, в том числе при успехе: следующий шаг правок —
      # чинить компиляцию по нему.
      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          retention-days: 14
          if-no-files-found: ignore

      - name: Collect IPA
        run: |
          set -euo pipefail
          mkdir -p build/artifacts
          # bazel-out — симлинк, поэтому find без -L молча вернёт пустоту.
          FOUND="$(find -L bazel-out -maxdepth 12 -path '*/bin/Telegram/Telegram.ipa' -type f | head -1)"
          if [ -z "$FOUND" ]; then
            echo "::error::IPA не найден — сборка отвалилась раньше упаковки"
            exit 1
          fi
          cp "$FOUND" build/artifacts/Telegram.ipa
          ls -lh build/artifacts/Telegram.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: Telegram-${{ github.run_number }}.ipa
          path: build/artifacts/Telegram.ipa
          retention-days: 30
          if-no-files-found: error