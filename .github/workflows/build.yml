name: CI

on:
  push:
    branches: [ master ]
  workflow_dispatch:
    inputs:
      runner:
        description: 'Образ macOS-раннера. Нужен с Xcode, близким к versions.json'
        required: false
        default: 'macos-15'
        type: string
      xcode_version:
        description: 'Версия Xcode. Пусто = newest доступный на раннере'
        required: false
        default: ''
        type: string
      continue_on_error:
        description: 'Показать ВСЕ ошибки компиляции за один прогон (bazel --keep_going)'
        required: false
        default: 'true'
        type: boolean

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # macos-13 снят GitHub. macos-26 нужен под Xcode 26.x из versions.json;
    # на macos-15 стоит Xcode 16.x, и сборка может не пройти — тогда ставь
    # runner: macos-26 вручную при запуске.
    runs-on: ${{ github.event.inputs.runner || 'macos-15' }}
    timeout-minutes: 350
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: 'recursive'
          # Полная история не нужна: build number берём из номера прогона,
          # а fetch-depth: 0 на репо с 268 сабмодулями стоит минут двадцати.
          fetch-depth: 1

      - name: Select Xcode
        id: xcode
        run: |
          set -euo pipefail

          # Ниже намеренно нет вложенных "$( ... )" с for/pipe внутри:
          # такая конструкция ломала парсинг bash. Всё плоско, шаг за шагом.
          WANTED="${{ github.event.inputs.xcode_version }}"
          if [ -z "$WANTED" ]; then
            WANTED="$(jq -r '.xcode' versions.json)"
          fi

          APP=""
          if [ -d "/Applications/Xcode_${WANTED}.app" ]; then
            APP="/Applications/Xcode_${WANTED}.app"
          fi

          if [ -z "$APP" ]; then
            # sort -Vr — от самой свежей версии к самой старой. Берём первую,
            # на которой xcodebuild реально отвечает.
            CANDIDATES="$(ls -d /Applications/Xcode*.app 2>/dev/null | sort -Vr || true)"
            for a in $CANDIDATES; do
              if [ -d "$a" ]; then
                if DEVELOPER_DIR="$a/Contents/Developer" xcodebuild -version >/dev/null 2>&1; then
                  APP="$a"
                  break
                fi
              fi
            done
          fi

          if [ -z "$APP" ]; then
            echo "::error::На раннере нет ни одного рабочего Xcode"
            exit 1
          fi

          KEEP_NAME="$(basename "$APP")"
          if [ "$KEEP_NAME" != "Xcode_${WANTED}.app" ]; then
            echo "::warning::Xcode ${WANTED} отсутствует, берём ${KEEP_NAME}. Если сборка не пройдёт — прогони с runner=macos-26."
          fi

          # Именно путь до .app: basename от производных DEVELOPER_DIR даёт
          # "Contents", и чистка диска снесла бы все Xcode вместе с выбранным.
          echo "XCODE_APP=$APP" >> "$GITHUB_ENV"
          echo "DEVELOPER_DIR=$APP/Contents/Developer" >> "$GITHUB_ENV"
          echo "selected=$KEEP_NAME" >> "$GITHUB_OUTPUT"

      # Место — главная причина падений: сборочному дереву нужно 30+ ГБ,
      # а на бесплатных macOS-раннерах его ~14. Выкидываем всё, что не нужно,
      # ДО сборки. Выбранный Xcode не трогаем.
      - name: Free disk space
        run: |
          set -euo pipefail
          KEEP="$(basename "$XCODE_APP")"
          df -h /

          for app in /Applications/Xcode*.app; do
            [ -e "$app" ] || continue
            [ "$(basename "$app")" = "$KEEP" ] && continue
            sudo rm -rf "$app"
          done

          sudo rm -rf /Library/Developer/CoreSimulator/Profiles/Runtimes
          sudo rm -rf /Library/Developer/CoreSimulator/Profiles/Devices
          sudo rm -rf /usr/local/share/chocolatey
          sudo rm -rf /Library/Developer/CoreSimulator/Caches
          rm -rf ~/Library/Caches/*
          rm -rf ~/Library/Developer/Xcode/DerivedData
          rm -rf /Users/runner/Library/Developer/CoreSimulator

          df -h /

      - name: Verify Xcode survived cleanup
        run: |
          set -euo pipefail
          if [ ! -d "$XCODE_APP" ]; then
            echo "::error::Выбранный Xcode $XCODE_APP удалён чисткой диска"
            exit 1
          fi
          # Одного DEVELOPER_DIR мало: Bazel фильтрует окружение перед
          # запуском действий, и до xcrun переменная не доходит — тот берёт
          # глобальный developer dir и падает на CommandLineTools.
          # Поэтому переключаем его по-настоящему, как это делает апстрим.
          sudo xcode-select -s "$XCODE_APP/Contents/Developer"

          # Bazel (в частности dav1d) жёстко ссылается на /Applications/Xcode.app.
          # Чистка диска сносит его вместе с остальными невыбранными, поэтому
          # восстанавливаем симлинк на выбранный Xcode. Иначе получаем
          # "no such sysroot directory" и невозможность найти errno.h.
          if [ "$XCODE_APP" != "/Applications/Xcode.app" ]; then
            sudo rm -rf /Applications/Xcode.app
            sudo ln -s "$XCODE_APP" /Applications/Xcode.app
          fi

          echo "XCODE_APP     : $XCODE_APP"
          echo "Xcode.app     : $(ls -ld /Applications/Xcode.app | awk '{print $NF}')"
          echo "xcode-select  : $(xcode-select -p)"
          xcodebuild -version
          if ! xcrun --sdk iphoneos --show-sdk-path >/dev/null 2>&1; then
            echo "::error::SDK iphoneos недоступен для выбранного Xcode"
            exit 1
          fi
          echo "SDK iphoneos  : $(xcrun --sdk iphoneos --show-sdk-path)"
          # Ровно тот путь, который Bazel подставит в -isysroot.
          echo "SDK через symlink: $(/usr/bin/xcrun --sdk iphoneos --show-sdk-path)"
          if [ ! -d /Applications/Xcode.app/Contents/Developer/Platforms/iPhoneOS.platform/Developer/SDKs ]; then
            echo "::error::SDK недоступен по пути /Applications/Xcode.app — Bazel его не найдёт"
            exit 1
          fi

      - name: Report disk headroom
        run: |
          set -euo pipefail
          # -P даёт POSIX-формат (одна строка заголовка), -K — килобайты.
          # Блок . в df -g на macOS ломает awk по NR==2, поэтому так.
          FREE_KB="$(df -Pk / | awk '$6 == "/" {print $4}')"
          if [ -z "$FREE_KB" ]; then
            echo "::warning::Не удалось определить свободное место"
            exit 0
          fi
          FREE_GB=$((FREE_KB / 1024 / 1024))
          echo "Свободно: ${FREE_GB} ГБ"
          if [ "$FREE_GB" -lt 35 ]; then
            echo "::warning::Свободно ${FREE_GB} ГБ, сборке нужно ~35. Скорее всего упадёт с 'No space left on device'. Нужен macOS large runner."
          fi

      # Раньше воркспейс переносился в /Users/Shared/telegram-ios, но это ломало
      # все node-шаги (actions/* запускаются из GITHUB_WORKSPACE и падают с
      # "No such file or directory"), а ещё съедало место на копирование.
      # Путь /Users/runner/work/<repo>/<repo> и так стабилен между прогонами.
      - name: Record source directory
        run: |
          set -euo pipefail
          echo "SOURCE_DIR=$GITHUB_WORKSPACE" >> "$GITHUB_ENV"

      - name: Import fake codesigning
        run: python3 build-system/Make/ImportCertificates.py --path build-system/fake-codesigning/certs

      - name: Build
        env:
          BAZEL_USER_ROOT: /private/var/tmp/_bazel_containerhost
        run: |
          set -euo pipefail

          BUILD_NUMBER="$((${{ github.run_number }} + $(cat build_number_offset)))"
          export APP_VERSION="$(python3 -c 'import json;print(json.load(open("versions.json"))["app"])')"
          echo "BUILD_NUMBER=$BUILD_NUMBER" >> "$GITHUB_ENV"
          echo "APP_VERSION=$APP_VERSION" >> "$GITHUB_ENV"

          CONTINUE=''
          if [ '${{ github.event.inputs.continue_on_error }}' != 'false' ]; then
            CONTINUE='--continueOnError'
          fi

          # pipefail обязателен: иначе tee съест код возврата и упавший Bazel
          # нарисуется зелёным.
          set -o pipefail
          python3 -u build-system/Make/Make.py \
            --bazelUserRoot="$BAZEL_USER_ROOT" \
            --overrideXcodeVersion \
            build \
            --configurationPath="build-system/fork-configuration.json" \
            --codesigningInformationPath=build-system/fake-codesigning \
            --configuration=release_arm64 \
            --buildNumber="$BUILD_NUMBER" \
            $CONTINUE 2>&1 | tee build.log

      # Лог недоступен через API без токена, поэтому при падении дублируем его
      # в аннотации — их GitHub отдаёт открыто, и чинить компиляцию можно,
      # не открывая браузер.
      - name: Report build failure
        if: failure()
        run: |
          set -uo pipefail
          if [ ! -f build.log ]; then
            echo "::error::build.log не найден — падение произошло до пайпа с tee"
            exit 0
          fi
          LINES="$(wc -l < build.log | tr -d ' ')"
          echo "::error::Сборка упала. build.log: ${LINES} строк. Ниже начало и конец."
          echo "===== НАЧАЛО ====="
          head -n 30 build.log | sed 's/^/::warning::/'
          echo "===== КОНЕЦ ====="
          tail -n 30 build.log | sed 's/^/::warning::/'

      # Лог нужен всегда, в том числе при успехе: следующий шаг правок —
      # чинить компиляцию по нему.
      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          retention-days: 14
          if-no-files-found: ignore

      # continue-on-error: сборка к этому моменту уже стоит 1.8 часа. Сбой на
      # поступочном шаге не должен помешать унести IPA — попытка ниже
      # диагностическая, а Upload IPA ищет файл сам, мимо неё.
      - name: Collect IPA
        continue-on-error: true
        run: |
          mkdir -p build/artifacts
          # Bazel-цель Telegram/Swiftgram кладёт Swiftgram.ipa, а не Telegram.ipa,
          # поэтому ищем по расширению. bazel-bin и bazel-out — симлинки,
          # без -L find молча вернёт пустоту.
          FOUND="$(find -L bazel-bin bazel-out -maxdepth 3 -name '*.ipa' -type f 2>/dev/null | head -1)"
          if [ -z "$FOUND" ]; then
            echo "::warning::Collect IPA ничего не нашёл, Upload IPA попробует сам"
            echo "::warning::Содержимое bazel-bin/Telegram:"
            ls bazel-bin/Telegram 2>/dev/null | head -40
          else
            echo "найдено: $FOUND"
            cp "$FOUND" build/artifacts/Telegram.ipa
            ls -lh build/artifacts/Telegram.ipa
          fi

      # Ищем по обоим путям: собранную копию и напрямую bazel-выход. Так
      # шаг сработает, даже если Collect отвалится.
      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: Telegram-${{ github.run_number }}.ipa
          path: |
            build/artifacts/Telegram.ipa
            bazel-bin/Telegram/*.ipa
            bazel-out/**/Telegram.ipa
          retention-days: 30
          if-no-files-found: warn

      # Дублируем IPA в Releases: артефакты живут 30 дней и висят только на
      # странице прогона, а релиз не исчезает и отдаётся по прямой ссылке.
      # gh уже есть на раннере, поэтому отдельный экшен не нужен.
      - name: Publish release
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: build-${{ github.run_number }}
        run: |
          set -uo pipefail
          IPA="build/artifacts/Telegram.ipa"
          if [ ! -f "$IPA" ]; then
            IPA="$(find -L bazel-bin bazel-out -maxdepth 3 -name '*.ipa' -type f 2>/dev/null | head -1)"
          fi
          if [ -z "$IPA" ] || [ ! -f "$IPA" ]; then
            echo "::warning::Релиз не создаём — IPA не нашлось. Артефакт выше должен был унести файл."
            exit 0
          fi
          NOTES="Swiftgram ${APP_VERSION} (build ${BUILD_NUMBER}), прогон #${GITHUB_RUN_NUMBER}."
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$IPA" --clobber
          else
            gh release create "$TAG" "$IPA" \
              --title "Swiftgram ${APP_VERSION} (${BUILD_NUMBER})" \
              --notes "$NOTES"
          fi
          echo "https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG/$(basename "$IPA")"